<style>
@page{size:Letter landscape;margin:.5in}
*{box-sizing:border-box}
body{font:9px/1.25 -apple-system,"Helvetica Neue",Arial,sans-serif;color:#1d2430;margin:0;background:#fff}
.page{break-after:page;width:1380px;overflow:hidden}.page:last-child{break-after:auto}
.top{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
h1{font-size:18px;margin:0}
.d,.lg{color:#6b7383;font-size:10.5px}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 8px}
.wk{margin-bottom:6px;break-inside:avoid}
.wk h2{font-size:12px;margin:0 0 5px;padding:4px 8px;border-radius:5px;color:#fff;background:#1c2330}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.day{border:1px dashed #cfd5df;border-radius:5px;padding:3px;min-height:105px}
.day.today{border:2px solid #1c2330}
.day h3{font-size:10.5px;margin:0 0 4px;padding-bottom:3px;border-bottom:1.5px solid #1c2330}
.past{font-size:10px;color:#c2410c;margin:0 0 4px}
.cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1fr;gap:5px}
.day .card .c,.day .card .m{display:none}
.col h2{font-size:11px;margin:0 0 4px;padding:4px 7px;border-radius:5px;color:#fff;display:flex;justify-content:space-between}
.hot h2{background:#c2410c}.wait h2{background:#3b4a63}.me h2{background:#6d5bd0}.ns h2{background:#9aa3b0}.st h2{background:#5b6475}.ma h2{background:#0f766e}.cu h2{background:#9c4221}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.card{border:1px solid #e3e6ea;border-left:4px solid #d7dce3;border-radius:4px;padding:3px 5px;margin-bottom:3px;break-inside:avoid;background:#fff}
.card.tent{border-style:dashed;border-width:1.2px;border-left-width:4px;border-color:#2f6fd0}.card.bp{background:#e7f5ec;border-left-color:#2f8f4e}.card.bi{background:#e7effc;border-left-color:#2f6fd0}
.t{font-weight:700}.n{color:#8a92a1;font-weight:400;margin-right:4px}.c{color:#8a92a1;font-weight:400;margin-left:5px}
.s{margin:1px 0}.m{display:flex;gap:10px;color:#5b6475}
.q{background:#eceef2;color:#677184;padding:0 4px;border-radius:2px;font-weight:700}.qm{color:#677184;font-weight:700}

body{margin:16px;background:#fff}
.page{margin-bottom:28px;border-bottom:1px solid #e3e6ea;padding-bottom:20px}
.upd{color:#6b7383;font-size:12px;margin:0 0 10px}
#lock{max-width:340px;margin:120px auto;font:15px -apple-system,"Helvetica Neue",Arial,sans-serif;text-align:center}
#lock input{font:inherit;padding:9px 12px;border:1px solid #cfd5df;border-radius:8px;width:100%;margin:12px 0}
#lock button{font:inherit;font-weight:600;padding:9px 18px;border:none;border-radius:8px;background:#2f6fd0;color:#fff;cursor:pointer}
#err{color:#c2410c;min-height:1.4em;font-size:13px}

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(D.salt), iterations:D.rounds, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(D.iv)}, key, u8(D.ct));
  document.getElementById("out").innerHTML = new TextDecoder().decode(pt);
  document.getElementById("lock").remove();
  try { localStorage.setItem("pc-pw", pw); } catch {}
}
document.getElementById("lock").addEventListener("submit", async e => {
  e.preventDefault(); const pw = document.getElementById("pw").value;
  try { await open(pw); } catch { document.getElementById("err").textContent = "Неверный пароль"; }
});
